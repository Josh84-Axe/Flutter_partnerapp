name: Deploy 3 Flutter Web Flavors to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy 3 Flutter Web Flavors

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ------------------------------------------------------------------------
      # FLAVOR 1: Family Web (family.tiknetafrica.com)
      # ------------------------------------------------------------------------
      - name: Build Family Web
        run: |
          flutter build web -t lib/main_family.dart --release \
            --dart-define=API_HOST=https://staging.wifi-4u.net \
            --dart-define=USE_REMOTE_API=true

      - name: Deploy Family Web → Cloudflare Pages (family)
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/web --project-name=family --commit-dirty=true
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ------------------------------------------------------------------------
      # FLAVOR 2: Campus Web (campus.tiknetafrica.com)
      # ------------------------------------------------------------------------
      - name: Build Campus Web
        run: |
          flutter build web -t lib/main_campus.dart --release \
            --dart-define=API_HOST=https://staging.wifi-4u.net \
            --dart-define=USE_REMOTE_API=true

      - name: Deploy Campus Web → Cloudflare Pages (campus)
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/web --project-name=campus --commit-dirty=true
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ------------------------------------------------------------------------
      # FLAVOR 3: Partner Web (partner.tiknetafrica.com)
      # ------------------------------------------------------------------------
      - name: Build Partner Web
        run: |
          flutter build web -t lib/main_partner.dart --release \
            --dart-define=API_HOST=https://staging.wifi-4u.net \
            --dart-define=USE_REMOTE_API=true

      - name: Deploy Partner Web → Cloudflare Pages (partner)
        uses: cloudflare/wrangler-action@v3
        with:
          command: pages deploy build/web --project-name=partner --commit-dirty=true
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
