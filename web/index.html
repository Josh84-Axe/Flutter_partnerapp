<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tiknet Africa Multi-Flavor Management App">
  <meta name="theme-color" content="#1A365D">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://*.cinetpay.com https://paystack.com https://*.paystack.com https://paystack.co https://*.paystack.co https://*.gstatic.com https://*.cloudflareinsights.com https://apis.google.com https://cdnjs.cloudflare.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://paystack.com https://*.paystack.com https://*.paystack.co; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://paystack.com https://*.paystack.com https://*.paystack.co; font-src 'self' data: https://fonts.gstatic.com https://*.gstatic.com; img-src 'self' data: https://* blob:; frame-src 'self' http: https: https://paystack.com https://*.paystack.com https://paystack.co https://*.paystack.co https://*.cinetpay.com; connect-src 'self' blob: http: https: ws: wss:;">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tiknet App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-512.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Apple Splash Screens -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Tiknet App</title>
  <script>
    var targetVersion = '1.2.313';
    window.targetVersion = targetVersion;
    let flavor = 'partner';
    let flavorTitle = 'Tiknet Partner';
    let flavorTheme = '#1A365D';
    
    if (window.location.hostname.includes('family')) {
      flavor = 'family';
      flavorTitle = 'Tiknet Family';
      flavorTheme = '#1A365D';
    } else if (window.location.hostname.includes('campus')) {
      flavor = 'campus';
      flavorTitle = 'Tiknet Campus';
      flavorTheme = '#0D9488';
    }
    
    document.title = flavorTitle;
    
    // Set dynamic icons & theme
    const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
    if (appleIcon) appleIcon.href = 'icons/' + flavor + '/Icon-192.png';
    
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');
    if (themeColorMeta) themeColorMeta.setAttribute('content', flavorTheme);
  </script>
  <link rel="manifest" href="manifest.json">

  <!-- Payment SDKs Integration -->
  <script src="https://cdn.cinetpay.com/seamless/main.js" type="text/javascript"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>

<body>
  <style>
    body {
      background-color: #0B192C;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background-color: #0B192C;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(0, 230, 118, 0.18) 0%, rgba(6, 182, 212, 0.12) 40%, transparent 70%),
        url('watermark_family.svg');
      background-repeat: repeat;
      background-size: 130px 130px;
      transition: opacity 0.4s ease-out;
    }
    .logo-box {
      padding: 16px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
    }
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 20px;
      animation: pulse 2.4s infinite ease-in-out;
    }
    .progress-box {
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .loader-bar-bg {
      width: 100%;
      height: 8px;
      background-color: rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.15);
    }
    .loader-bar-fill {
      width: 5%;
      height: 100%;
      background: linear-gradient(90deg, #00E676 0%, #00B0FF 100%);
      border-radius: 10px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.7);
    }
    .progress-text {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 0.5px;
    }
    .progress-percent {
      font-size: 13px;
      font-weight: 700;
      color: #00E676;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.85; }
    }
  </style>

  <div id="loading">
    <div class="logo-box">
      <img id="app-logo-img" src="icons/Icon-192.png" class="logo" alt="Tiknet App" />
    </div>
    <div class="progress-box">
      <div class="loader-bar-bg">
        <div id="loader-fill" class="loader-bar-fill"></div>
      </div>
      <div style="display: flex; justify-content: space-between; width: 100%;">
        <span class="progress-text" id="loader-status">Downloading App...</span>
        <span class="progress-percent" id="loader-percent">5%</span>
      </div>
    </div>
  </div>

  <script>
    console.log('🚀 Tiknet App v' + targetVersion);

    const loadStartTime = Date.now();

    // Dynamic Logo & Inlined Data-URI Loader Backgrounds (Selected Options F1, P1, C1)
    const logoImg = document.getElementById('app-logo-img');
    if (logoImg) logoImg.src = 'icons/' + flavor + '/Icon-192.png';

    const loader = document.getElementById('loading');
    const fill = document.getElementById('loader-fill');
    const text = document.getElementById('loader-status');
    const percent = document.getElementById('loader-percent');

      if (flavor === 'family') {
        // Soft Family Warmth & Protection (#FDFBF7 ivory canvas with soft amber & sky blue glow)
        document.body.style.backgroundColor = '#FDFBF7';
        loader.style.backgroundColor = '#FDFBF7';
        loader.style.backgroundImage = "radial-gradient(circle at 50% 35%, rgba(254, 243, 199, 0.7) 0%, rgba(224, 242, 254, 0.45) 50%, transparent 75%)";
        if (text) text.style.color = '#92400E';
        if (percent) percent.style.color = '#B45309';
        if (fill) fill.style.background = 'linear-gradient(90deg, #F59E0B 0%, #D97706 100%)';
      } else if (flavor === 'partner') {
        // Option P1: Lively Mint Growth Gradient
        document.body.style.backgroundColor = '#DCFCE7';
        loader.style.backgroundColor = '#DCFCE7';
        loader.style.backgroundImage = "radial-gradient(circle at 50% 35%, rgba(74, 222, 128, 0.45) 0%, rgba(134, 239, 172, 0.3) 50%, transparent 75%)";
        if (text) text.style.color = '#064E3B';
        if (percent) percent.style.color = '#047857';
        if (fill) fill.style.background = 'linear-gradient(90deg, #059669 0%, #047857 100%)';
      } else if (flavor === 'campus') {
        // Option C1: Bright Academic Slate
        document.body.style.backgroundColor = '#F8FAFC';
        loader.style.backgroundColor = '#F8FAFC';
        loader.style.backgroundImage = "radial-gradient(circle at 50% 35%, rgba(13, 148, 136, 0.28) 0%, rgba(20, 184, 166, 0.16) 50%, transparent 75%)";
        if (text) text.style.color = '#0F172A';
        if (percent) percent.style.color = '#0D9488';
        if (fill) fill.style.background = 'linear-gradient(90deg, #0D9488 0%, #0F766E 100%)';
      }

    let simulatedPercent = 5;
    const progressFill = document.getElementById('loader-fill');
    const progressPercent = document.getElementById('loader-percent');
    const progressStatus = document.getElementById('loader-status');

    function setProgress(pct, statusText) {
      if (progressFill) progressFill.style.width = Math.min(100, Math.max(5, pct)) + '%';
      if (progressPercent) progressPercent.textContent = Math.round(pct) + '%';
      if (statusText && progressStatus) progressStatus.textContent = statusText;
    }

    const progressTimer = setInterval(() => {
      if (simulatedPercent < 95) {
        simulatedPercent += Math.random() * 8 + 4;
        if (simulatedPercent > 95) simulatedPercent = 95;
        setProgress(
          simulatedPercent,
          simulatedPercent < 75 ? 'Downloading App Assets...' : 'Initializing Engine...'
        );
      }
    }, 120);

    // Loader Dismissal Helper with minimum display time guarantee
    window.hideAppLoading = function() {
      const elapsed = Date.now() - loadStartTime;
      const minDisplay = 1000;
      const delay = Math.max(0, minDisplay - elapsed);

      setTimeout(function() {
        clearInterval(progressTimer);
        setProgress(100, 'Ready!');
        const loader = document.getElementById('loading');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 400);
        }
      }, delay);
    };
    window.addEventListener('flutter-first-frame', window.hideAppLoading);
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(window.hideAppLoading, 6000);
    });
    
    // Global PWA Install & Update Bridge
    let deferredPrompt = null;
    window.pwaUpdateAvailable = false;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (window.onAppInstallable) {
        window.onAppInstallable();
      }
      window.dispatchEvent(new CustomEvent('pwa_installable'));
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      if (window.onAppInstalled) {
        window.onAppInstalled();
      }
      window.dispatchEvent(new CustomEvent('pwa_installed'));
    });

    window.isAppInstallable = function () {
      return deferredPrompt !== null;
    };

    window.isInstallPromptSupported = function () {
      return 'beforeinstallprompt' in window || /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    };

    window.isStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };

    window.promptAppInstall = function () {
      return new Promise((resolve) => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted PWA install prompt');
              deferredPrompt = null;
              resolve(true);
            } else {
              console.log('User dismissed PWA install prompt');
              resolve(false);
            }
          });
        } else {
          resolve(false);
        }
      });
    };

    // Service Worker Update Listener & Helper
    function checkServiceWorkerUpdate(reg) {
      function notifyUpdateAvailable(newVer) {
        const ver = newVer || targetVersion;
        const appliedVersion = localStorage.getItem('pwa_applied_version');
        if (appliedVersion === ver || appliedVersion === targetVersion) return;
        
        console.log('✨ [ServiceWorker] New PWA version ready:', ver);
        window.pwaUpdateAvailable = true;
        window.pwaLatestVersion = ver;
        if (window.onPwaUpdateAvailable) window.onPwaUpdateAvailable(ver);
        window.dispatchEvent(new CustomEvent('pwa_update_available', { detail: { version: ver } }));
      }

      // 1. Check version.json from server directly
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          if (data && data.version && data.version !== targetVersion) {
            notifyUpdateAvailable(data.version);
          }
        })
        .catch(() => {});

      // 2. Service worker lifecycle listener
      if (reg) {
        reg.addEventListener('updatefound', function () {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', function () {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              notifyUpdateAvailable(window.pwaLatestVersion || targetVersion);
            }
          });
        });

        if (reg.waiting && navigator.serviceWorker.controller) {
          notifyUpdateAvailable(window.pwaLatestVersion || targetVersion);
        }
      }
    }

    // Explicit User Action Only: Applies update and reloads page once
    window.applyPwaUpdate = function() {
      try {
        localStorage.setItem('pwa_applied_version', window.pwaLatestVersion || targetVersion);
        localStorage.setItem('show_pwa_update_toast', 'true');
      } catch(e) {}
      window.pwaUpdateAvailable = false;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          window.location.reload();
        }).catch(function() {
          window.location.reload();
        });
      } else {
        window.location.reload();
      }
    };

    // Payment SDK Helpers
    window.launchCinetPay = function(config) {
      if (!window.CinetPay) {
        console.warn("CinetPay SDK unavailable. Falling back to regional WAEMU XOF Paystack gateway...");
        if (window.launchPaystack) {
          const rawCountry = (config.country || '').toLowerCase();
          const curr = (config.currency || '').toUpperCase();
          const isNG = rawCountry === 'ng' || rawCountry === 'nigeria' || curr === 'NGN';
          const isXOF = rawCountry === 'tg' || rawCountry === 'ci' || rawCountry === 'bj' || rawCountry === 'sn' || 
                        rawCountry === 'bf' || rawCountry === 'ml' || rawCountry === 'ne' || 
                        curr === 'XOF' || curr === 'CFA' || curr.indexOf('CFA') >= 0;
          
          const paystackKey = isNG 
            ? 'pk_live_17ec7671a46b89cb2cc5314eb69e93d21e9afa9e' 
            : isXOF 
              ? 'pk_live_0cf935a263256e6a1f8e9d59bb33b6c252691d75' 
              : 'pk_live_ba6137ee394e83ff5b0cfec596851545e1dea426';

          const targetCurrency = isNG ? 'NGN' : (isXOF ? 'XOF' : (curr || 'GHS'));
          const validEmail = (config.email && config.email.indexOf('@') > 0) ? config.email.trim() : 'dematexperts@gmail.com';
          
          window.launchPaystack({
            key: paystackKey,
            email: validEmail,
            amount: config.amount * 100,
            currency: targetCurrency,
            ref: config.transactionId,
            planName: config.description
          });
          return;
        }
        alert("Payment Gateway SDK unavailable! Please check your internet connection.");
        return;
      }
      try {
        CinetPay.setConfig({
          apikey: config.apiKey, site_id: config.siteId, notify_url: config.notifyUrl, mode: 'PRODUCTION'
        });
        
        CinetPay.getCheckout({
          transaction_id: config.transactionId, amount: config.amount, currency: config.currency,
          channels: 'ALL', description: config.description, customer_name: config.customerName,
          customer_surname: config.customerSurname, customer_email: config.email && config.email.indexOf('@') > 0 ? config.email : 'dematexperts@gmail.com',
          customer_phone_number: config.customerPhoneNumber, customer_address: config.address || "Main Street",
          customer_city: config.city || (config.country === "TG" ? "Lomé" : "Abidjan"), customer_country: config.country || (config.currency === "XOF" ? "TG" : "CI"), customer_state: config.country || "TG",
          customer_zip_code: config.country === "TG" ? "00228" : "00225", return_url: config.returnUrl, wait_response: true
        });

        CinetPay.waitResponse(function(data) {
           if (data.status == "ACCEPTED") {
              if (window.onPaymentSuccess) window.onPaymentSuccess(config.transactionId);
           } else {
              if (window.onPaymentError) window.onPaymentError(data);
           }
        });

        CinetPay.onError(function(data) {
          if (window.onPaymentError) window.onPaymentError(data);
        });

        CinetPay.onClose(function(data) {
          if (window.onPaymentError) window.onPaymentError({message: "closed"});
        });
      } catch (e) {
        console.error('CinetPay Launch Error:', e);
      }
    };

    window.launchPaystack = function (config) {
      if (!window.PaystackPop) {
        alert("Paystack SDK not loaded! Please check your internet connection.");
        return;
      }
      try {
        const rawCurr = (config.currency || '').toUpperCase();
        const currency = (rawCurr === 'CFA' || rawCurr.indexOf('CFA') >= 0) ? 'XOF' : (rawCurr || 'GHS');
        const channels = (currency === 'GHS' || currency === 'XOF') 
            ? ['mobile_money', 'card'] 
            : ['card', 'bank', 'ussd', 'bank_transfer', 'mobile_money'];
        const validEmail = (config.email && config.email.indexOf('@') > 0) ? config.email.trim() : 'dematexperts@gmail.com';
        const handler = PaystackPop.setup({
          key: config.key, email: validEmail, amount: config.amount, currency: currency, channels: channels, ref: config.ref,
          metadata: {
            custom_fields: [
              { display_name: "Plan ID", variable_name: "plan_id", value: config.planId },
              { display_name: "Plan Name", variable_name: "plan_name", value: config.planName }
            ]
          },
          callback: function (response) {
            if (window.onPaystackSuccess) window.onPaystackSuccess(response.reference);
          },
          onClose: function () {
            if (window.onPaystackCancel) window.onPaystackCancel();
          }
        });
        handler.openIframe();
      } catch (e) {
        console.error('Paystack Launch Error:', e);
      }
    };

    // Stable Version Tracking
    window.appVersion = targetVersion;
    try {
      localStorage.setItem('last_version', targetVersion);
    } catch(e) {}

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js?v=' + targetVersion).then(function (reg) {
          console.log('✅ ServiceWorker registered');
          checkServiceWorkerUpdate(reg);

          // Periodic check for SW update every 15 minutes
          setInterval(function () {
            reg.update();
          }, 15 * 60 * 1000);

          // Check on tab visibility change / focus
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              reg.update();
            }
          });
        });
      });
    }

    // PWA Smart Router Discovery Functions
    window.detectLocalSubnet = function () {
      return new Promise((resolve) => {
        try {
          var pc = new RTCPeerConnection({ iceServers: [] });
          pc.createDataChannel('');
          pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => resolve(null));
          var resolved = false;
          pc.onicecandidate = function (ice) {
            if (!ice || !ice.candidate || !ice.candidate.candidate || resolved) return;
            var match = /([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}/.exec(ice.candidate.candidate);
            if (match && match[1]) {
              resolved = true;
              var subnet = match[1] + '.1';
              console.log('📡 [PWA Discovery] WebRTC detected local subnet gateway:', subnet);
              resolve(subnet);
            }
          };
          setTimeout(() => { if (!resolved) resolve(null); }, 1500);
        } catch (e) { resolve(null); }
      });
    };

    window.probeIpTiming = function (ip) {
      return new Promise((resolve) => {
        var start = Date.now();
        var img = new Image();
        var done = false;
        var finish = function (exists) {
          if (done) return;
          done = true;
          var elapsed = Date.now() - start;
          resolve({ ip: ip, duration: elapsed, exists: exists && elapsed < 650 });
        };
        img.onload = function () { finish(true); };
        img.onerror = function () { finish(true); };
        img.src = 'http://' + ip + '/favicon.ico?' + Math.random();
        setTimeout(function () { finish(false); }, 750);
      });
    };
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>

</html>
